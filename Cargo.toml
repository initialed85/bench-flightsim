[workspace]
resolver = "2"
members = ["common", "server", "client"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = "0.32"

# The wasm client is the thing that has to be small: Bevy's render stack dominates.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
